<svg class="art-svg" viewBox="0 0 240 150" role="img" aria-label="Bucket of popcorn">

  <g class="kernel">
    <circle cx="120" cy="28" r="12"/>
    <circle cx="103" cy="38" r="11"/>
    <circle cx="137" cy="38" r="11"/>
    <circle cx="88" cy="52" r="11"/>
    <circle cx="152" cy="52" r="11"/>
    <circle cx="120" cy="44" r="11"/>
    <circle cx="106" cy="54" r="11"/>
    <circle cx="134" cy="54" r="11"/>
  </g>
  <!-- falling kernels -->
  <g class="f"><circle cx="66" cy="128" r="5"/><circle cx="176" cy="132" r="4"/><circle cx="184" cy="116" r="3.5"/></g>
  <!-- bucket body (masks popcorn behind it) -->
  <path class="mask" d="M80 64 H160 L148 140 H92 Z"/>
  <!-- stripes -->
  <g class="solid">
    <path d="M80 64 H96 L101 140 H92 Z"/>
    <path d="M112 64 H128 L127 140 H113 Z"/>

  </g>
  <path class="line" d="M80 64 H160 L148 140 H92 Z"/>

  <rect class="solid" x="76" y="60" width="88" height="8" rx="2"/>
</svg>
