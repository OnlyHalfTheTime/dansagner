{{ define "main" }}
<article class="article article-media">
  <header class="article-header media-header">
    {{ with .Params.featureimage }}
      <img class="cover" src="{{ . }}" alt="" loading="lazy" referrerpolicy="no-referrer">
    {{ end }}
    <div>
      <p class="label"><a href="{{ .Parent.RelPermalink }}">{{ .Parent.Title }}</a></p>
      <h1>{{ .Title }}</h1>
      {{ partial "mediainfo.html" . }}
    </div>
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
